<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8fdef7">
    <meta name="description"
      content="Garcia Kids Playground — games and movies for the kids.">
    <link rel="icon" href="../../icon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16"
      href="../../icon/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32"
      href="../../icon/icon-32.png">
    <link rel="icon" type="image/png" sizes="128x128"
      href="../../icon/icon-128.png">
    <link rel="icon" type="image/png" sizes="256x256"
      href="../../icon/icon-256.png">
    <link rel="apple-touch-icon" sizes="256x256" href="../../icon/icon-256.png">
    <title>Garcia Kids Playground</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../../script.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body class="stopwatch-page">
    <main class="playground">
      <header class="masthead">
        <h1 class="sr-only">Garcia Kids Playground</h1>
        <a href="../../index.html" aria-label="Garcia Kids Playground home">
          <img class="title-art"
            src="../../assets/Title_GarciaKidsPlayground.png" alt
            width="882" height="271">
        </a>
      </header>

      <div class="panels panels--single">
        <section class="panel panel--other" aria-labelledby="apps-heading">
          <h2 id="apps-heading">Stop Watch</h2>
          <div class="stopwatch-app">
            <header class="stopwatch-header">
              <h1 class="stopwatch-h1">Stopwatch</h1>
            </header>
            <main class="stopwatch-main">
              <section class="stopwatch-display-section" id="display"
                aria-live="polite">
                <div class="display-deco">
                  <div class="time-group">
                    <span class="time minutes">00</span>
                    <span class="label">MIN</span>
                  </div>
                  <span class="divider">:</span>
                  <div class="time-group">
                    <span class="time seconds">00</span>
                    <span class="label">SEC</span>
                  </div>
                  <span class="divider">.</span>
                  <div class="time-group">
                    <span class="time milliseconds">00</span>
                    <span class="label">MS</span>
                  </div>
                </div>
              </section>
              <nav class="controls">
                <button class="lap-btn" id="lap-btn" type="button"
                  aria-label="Save laptime" disabled>
                  Lap
                </button>
                <button class="toggle-btn" type="button" aria-pressed="false"
                  aria-label="Start timer">
                </button>
                <button class="reset-btn" type="button" aria-label="Reset timer"
                  disabled>
                  Reset
                </button>
              </nav>
            </main>
            <section class="laps-section" aria-labelledby="laps-title">
              <h2 class="laps-title" id="laps-title">laptime</h2>
              <ol class="laps" aria-live="polite"></ol>
            </section>
          </div>
          <br>
        </section>
      </div>
    </main>

    <footer class="site-footer"></footer>

    <div class="notice" id="notice" role="status" aria-live="polite"
      hidden></div>
  </body>
</html>
