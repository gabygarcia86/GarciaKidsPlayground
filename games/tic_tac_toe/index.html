<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8fdef7">
    <meta name="description"
      content="Garcia Kids Playground — games and movies for the kids.">
    <link rel="icon" href="../../icon/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16"
      href="../../icon/icon-16.png">
    <link rel="icon" type="image/png" sizes="32x32"
      href="../../icon/icon-32.png">
    <link rel="icon" type="image/png" sizes="128x128"
      href="../../icon/icon-128.png">
    <link rel="icon" type="image/png" sizes="256x256"
      href="../../icon/icon-256.png">
    <link rel="apple-touch-icon" sizes="256x256" href="../../icon/icon-256.png">
    <title>Garcia Kids Playground</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../../script.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="playground">
      <header class="masthead">
        <h1 class="sr-only">Garcia Kids Playground</h1>
        <a href="../../index.html" aria-label="Garcia Kids Playground home">
          <img class="title-art"
            src="../../assets/Title_GarciaKidsPlayground.png" alt
            width="882" height="271">
        </a>
      </header>

      <div class="panels panels--single">
        <section class="panel panel--other" aria-labelledby="apps-heading">
          <h2 id="apps-heading">Tic Tac Toe</h2>

          <div class="app">
            <header class="ttt-header">
              <p>
                Player 1: <span class="badge">X</span> | Player 2: <span
                  class="badge badge-o">O</span>
              </p>
            </header>

            <main class="ttt-main">
              <div class="status-bar">
                <span class="status-text" id="statusText">Player 1 (X)
                  turn</span>
                <button id="resetBtn" class="reset-btn">Reset</button>
              </div>

              <div class="board">
                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>
                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>
                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>
              </div>
            </main>

            <footer class="ttt-footer">
              <p>First to get three in a row wins. Take turns playing.</p>
            </footer>
          </div>

        </section>
      </div>
    </main>

    <footer class="site-footer"></footer>

    <div class="notice" id="notice" role="status" aria-live="polite"
      hidden></div>
  </body>
</html>
